# Read the Docs: https://amstrax.readthedocs.io
# The reference pages (API, data structure) are generated at build time by docs/source/conf.py.
version: 2

build:
  os: "ubuntu-24.04"
  tools:
    python: "3.12"
  apt_packages:
    - graphviz

sphinx:
  configuration: docs/source/conf.py

python:
  install:
    - requirements: extra_requirements/requirements-docs.txt
    - method: pip
      path: .
