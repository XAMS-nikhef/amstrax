name: Test package

# Tests on the two software stacks that run on STBC: production (Python 3.12, strax 2) and the py38 fallback
# (Python 3.8, strax 1.5.4). Coverage is reported from the production stack.
on:
  workflow_dispatch:
  release:
    types: [ created ]
  pull_request:
  push:
    branches:
      - master
      - stable

jobs:
  update:
    name: "pytest_py${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: False
      matrix:
        include:
          - python-version: "3.12"
            requirements: extra_requirements/requirements-tests.txt
            coverage: true
          - python-version: "3.8"
            requirements: extra_requirements/requirements-tests-py38.txt
            coverage: false
    steps:
      # Setup and installation
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: ${{ matrix.requirements }}
      - name: install files
        run:
          |
          git clone https://github.com/XAMS-nikhef/amstrax_files --single-branch ../amstrax_files
          pip install -e ../amstrax_files
      - name: Install requirements
        run:
          |
          pip install -r ${{ matrix.requirements }}
          pip install -e .
      - name: Test package
        if: ${{ !matrix.coverage }}
        run: |
          pytest -rsxv --durations 0
      - name: Test package with coverage
        if: ${{ matrix.coverage }}
        env:
          NUMBA_DISABLE_JIT: 1
        run: |
          coverage run --source=amstrax -m pytest -rsxv --durations 0
      - name: Coveralls
        if: ${{ matrix.coverage }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          coveralls --service=github
